name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: CLI smoke test
        run: |
          sk-asr-bench run --system hyp:tests/fixtures/hyp.jsonl --dataset jsonl:tests/fixtures/refs.jsonl --out /tmp/results
          sk-asr-bench report --results /tmp/results
